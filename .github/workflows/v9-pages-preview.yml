name: V9 Isolated Pages Candidate

on:
  push:
    branches:
      - feature/v9-professional-polish
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v9-candidate
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: v9-candidate-preview
      url: ${{ steps.deployment.outputs.page_url }}v9-preview/
    steps:
      - name: Checkout stable V8
        uses: actions/checkout@v4
        with:
          ref: ad64d1618cce57a78af75ee29ff974d1e182f835
          path: stable-v8

      - name: Checkout V9 candidate
        uses: actions/checkout@v4
        with:
          path: v9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build stable V8 root
        working-directory: stable-v8
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install and unit-test V9
        working-directory: v9
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Install Chromium
        working-directory: v9
        run: npx playwright install --with-deps chromium

      - name: Build local-root V9 for real browser validation
        working-directory: v9
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Play V9 in Chromium
        working-directory: v9
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-browser-evidence
          path: |
            v9/e2e-artifacts
            v9/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Build V9 Pages subpath
        working-directory: v9
        env:
          VITE_BASE_PATH: /CRISIS-ELECTRO-INGENIERIA/v9-preview/
        run: npm run build

      - name: Compose stable root plus isolated V9 candidate and evidence
        shell: bash
        run: |
          mkdir -p site/v9-preview site/v9-evidence
          cp -R stable-v8/dist/. site/
          cp -R v9/dist/. site/v9-preview/
          cp -R v9/e2e-artifacts/. site/v9-evidence/
          test -f site/index.html
          test -f site/v9-preview/index.html
          test -f site/v9-evidence/metrics.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy isolated candidate
        id: deployment
        uses: actions/deploy-pages@v4
