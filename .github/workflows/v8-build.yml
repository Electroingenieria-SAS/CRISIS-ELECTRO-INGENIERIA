name: V8 Build Verification

on:
  push:
    branches:
      - feature/adventure-v8-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v8-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript and production build
        run: npm run build
